<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101525">
  <title>Ken Store</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== PHẦN TRANG CÁ NHÂN ===== -->
  <div class="personal-section">
    <div class="typing">
      <span>&lt;/&gt;</span> <span id="typing-text">Developer</span> |
    </div>

    <div class="profile-card">
      <div class="banner">
        <img class="bg" src="images/Banggia.jpg" alt="banner">
        <div class="avatar-wrapper">
          <div class="avatar-ring"></div>
          <img class="avatar" src="images/Ken.PNG" alt="avatar">
          <div class="status"></div>
        </div>
      </div>

      <h1>Ken Store <span class="verified">✓</span></h1>
      <p class="bio">Kho chia sẻ ứng dụng iPhone • IPA • DNS • Chứng chỉ</p>

      <div class="stats">
        <div class="stat">
          <div class="number" data-target="50">0</div>
          <div class="label">Ứng dụng</div>
        </div>
        <div class="stat">
          <div class="number" data-target="1000">0</div>
          <div class="label">Lượt tải</div>
        </div>
        <div class="stat">
          <div class="number" data-target="3">0</div>
          <div class="label">Năm hoạt động</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== PHẦN CỬA HÀNG ===== -->
  <main>
    <section class="section" id="apps">
      <div class="section-heading">
        <div>
          <div class="eyebrow muted">THƯ VIỆN</div>
          <h2>Ứng dụng nổi bật</h2>
        </div>
        <span class="count" id="app-count">01 ứng dụng</span>
      </div>
      <div class="app-grid" id="app-grid"></div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Ken Store</span>
    <span>Chia sẻ ứng dụng có trách nhiệm.</span>
  </footer>

  <script src="apps.js"></script>
  <script src="script.js"></script>
</body>
</html>
